<!doctype html>
<html lang="pt-BR" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Dantai Fênix | Movimentar Estoque</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_EW1pVi14HZShWF8KD4Uu3NALLJ7uBalzJA&s" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body onload="carregarHome()">
<div id="app-wrapper">

    <div id="mobile-overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content d-flex flex-column">

        <div class="modal fade" id="modalMsg" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg" style="margin: 0 auto; width: 30%">
                <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                    <div class="modal-header border-bottom-0 pb-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-pencil-square fs-5"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark">Aviso</h5>
                                <span id="modalSubtitulo" class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;"></span>
                            </div>
                        </div>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 pt-3" style="margin-bottom: -5%">
                        <p id="msg" class="modal-title font-display fw-bold text-dark" ></p>
                        <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                            <button type="button" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2" data-bs-dismiss="modal">
                                <i class="bi bi-save"></i> Fechar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container-fluid p-4 p-md-5 mx-auto" style="max-width: 70%;">

            <div class="text-center mb-5">
                <h2 class="font-display fw-bold display-6 mb-2 text-dark">Movimentar Estoque</h2>
                <p class="text-muted mx-auto" style="max-width: 500px;">Entrada e Saída de produtos</p>
            </div>

            <div class="glass-panel p-4 p-md-5 shadow-lg position-relative overflow-hidden" style="border-top: 4px solid var(--taiko-red); background-color: #ffffff;">
                <i class="bi bi-calendar-event position-absolute" style="font-size: 18rem; right: -40px; bottom: -60px; opacity: 0.03; z-index: 0; color: var(--taiko-ink); transform: rotate(-15deg);"></i>

                <div id="container" class="position-relative z-1">

                    <div class="d-flex align-items-center mb-5 pb-3 border-bottom border-light flex-wrap gap-3">
                        <div class="flex-grow-1">
                            <h4 class="font-display fw-bold m-0 text-dark">Dados do instrumentos</h4>
                            <span id="subtitulo" class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.15em;">Nova entrada</span>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-taiko fw-bold d-flex align-items-center gap-2 px-4 shadow-sm" onclick="exibirEntrada()">
                                <i class="bi bi-box-arrow-in-right fs-5"></i> Entrada
                            </button>
                            <button type="button" class="btn btn-dark fw-bold d-flex align-items-center gap-2 px-4 shadow-sm" onclick="exibirSaida()">
                                <i class="bi bi-box-arrow-right fs-5"></i> Saída
                            </button>
                        </div>
                    </div>

                    <form id="formEstoque" autocomplete="off">
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/controlarEstoque.js"></script>
</body>
</html>
