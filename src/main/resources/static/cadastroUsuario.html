<!doctype html>
<html lang="pt-br" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Dantai Fênix - Cadastro de Usuário</title>

    <link rel="icon"
          href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_EW1pVi14HZShWF8KD4Uu3NALLJ7uBalzJA&s"
          type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <link href="css/style.css" rel="stylesheet" />

    <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body onload="carregarHome()">

<!-- ICONES ALERTA -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="check-circle-fill" fill="currentColor" viewBox="0 0 16 16">
        <path
                d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
    </symbol>

    <symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
        <path
                d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
    </symbol>

<div id="app-wrapper">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content d-flex flex-column">

        <div class="container-fluid p-4 p-md-5 mx-auto" style="max-width: 800px;">

            <div id="containerMensagem"></div>

            <div class="text-center mb-5">
                <h2 class="font-display fw-bold display-6 mb-2 text-dark">
                    Controle de Acessos
                </h2>

                <p class="text-muted mx-auto" style="max-width: 500px;">
                    Cadastro de usuários do sistema.
                </p>
            </div>

            <div class="glass-panel p-4 p-md-5 shadow-lg position-relative overflow-hidden"
                 style="border-top: 4px solid var(--taiko-gold); background-color: #ffffff;">

                <i class="bi bi-person-lock position-absolute"
                   style="font-size: 18rem; right: -40px; bottom: -60px; opacity: 0.03; z-index: 0; color: var(--taiko-ink); transform: rotate(-10deg);">
                </i>

                <div class="position-relative z-1">

                    <div class="d-flex align-items-center gap-3 mb-5 pb-3 border-bottom border-light">

                        <div class="bg-taiko-gold p-3 rounded-circle d-flex align-items-center justify-content-center shadow-sm"
                             style="width: 55px; height: 55px;">

                            <i class="bi bi-person-fill-lock fs-4"></i>

                        </div>

                        <div>
                            <h4 class="font-display fw-bold m-0 text-dark">
                                Cadastro de Usuário
                            </h4>

                            <span class="text-taiko-red small fw-bold text-uppercase"
                                  style="letter-spacing: 0.15em;">
                                    Novo Acesso
                                </span>
                        </div>

                    </div>

                    <form id="formCadastroUsuario" novalidate>

                        <div class="mb-4">

                            <label for="nomeMembro"
                                   class="form-label fw-semibold text-secondary small text-uppercase"
                                   style="letter-spacing: 0.05em;">

                                Nome do Membro
                                <span class="text-danger">*</span>

                            </label>

                            <div class="input-group input-group-lg shadow-sm">

                                    <span
                                            class="input-group-text bg-light border-end-0 text-taiko-gold">

                                        <i class="bi bi-person-badge"></i>

                                    </span>

                                <input type="text"
                                       class="form-control border-start-0 ps-0 fw-medium bg-light"
                                       name="nomeMembro"
                                       id="nomeMembro"
                                       placeholder="Digite o nome completo do membro"
                                       required>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="usuario"
                                   class="form-label fw-semibold text-secondary small text-uppercase"
                                   style="letter-spacing: 0.05em;">

                                Usuário/Login
                                <span class="text-danger">*</span>

                            </label>

                            <div class="input-group input-group-lg shadow-sm">

                                    <span
                                            class="input-group-text bg-light border-end-0 text-secondary">

                                        <i class="bi bi-person-vcard"></i>

                                    </span>

                                <input type="text"
                                       class="form-control border-start-0 ps-0 fw-medium bg-light"
                                       name="usuario"
                                       id="usuario"
                                       placeholder="Ex: joao.silva"
                                       required>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="senha"
                                   class="form-label fw-semibold text-secondary small text-uppercase"
                                   style="letter-spacing: 0.05em;">

                                Senha
                                <span class="text-danger">*</span>

                            </label>

                            <div class="input-group input-group-lg shadow-sm">

                                    <span
                                            class="input-group-text bg-light border-end-0 text-secondary align-items-start pt-3">

                                        <i class="bi bi-key-fill"></i>

                                    </span>

                                <input type="password"
                                       class="form-control border-start-0 ps-0 fw-medium bg-light"
                                       name="senha"
                                       id="senha"
                                       placeholder="Digite a senha do usuário"
                                       required>

                            </div>

                        </div>

                        <div
                                class="d-flex flex-column flex-md-row justify-content-end gap-3 mt-5 pt-3">

                            <button type="reset"
                                    class="btn btn-light px-4 py-3 fw-semibold text-secondary shadow-sm d-flex align-items-center justify-content-center gap-2"
                                    style="border: 1px solid #e5e7eb;">

                                <i class="bi bi-eraser fs-5"></i>
                                Limpar

                            </button>

                            <button type="submit"
                                    class="btn btn-taiko px-5 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">

                                <i class="bi bi-check2-square fs-5"></i>
                                Registrar Usuário

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="js/sidebars.js"></script>
<script src="js/script.js"></script>
<script src="js/cadastroUsuario.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous">
</script>

</body>

</html>
