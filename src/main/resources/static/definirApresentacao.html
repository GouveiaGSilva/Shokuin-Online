<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Definir Apresentação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="css/apresentacao.css" rel="stylesheet">
</head>
<body>

    <header>
        <buttom onclick="window.history.back()" class="btn-ui-back">
            <i class="bi bi-arrow-left"></i> Sistema
        </buttom>
    </header>

    <main class="main-content d-flex flex-column align-items-center">
        <div id="wizard-nav-container" style="width: 100%; max-width: 1100px; padding: 20px;"></div>
        <div class="titulo-container flex-grow-1 d-flex justify-content-center align-items-center w-100 flex-column position-relative">
            <input type="text" id="doc-titulo" class="titulo-apresentacao"
                   value="NOME DA APRESENTAÇÃO" spellcheck="false">
            <div id="erro-titulo" class="text-danger mt-2 position-absolute" style="display: none; top: 65%; font-family: system-ui, -apple-system, sans-serif; font-size: 0.9rem; font-weight: 600;">
                <i class="bi bi-exclamation-circle me-1"></i>O título deve ser único.
            </div>
        </div>
    </main>

    <footer>
        <button class="btn-next" id="btn-proximo">
            Próxima Etapa <i class="bi bi-arrow-right ms-2"></i>
        </button>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/definirApresentacao.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if(typeof injetarMenuEtapas === 'function') {
                injetarMenuEtapas("nome");
            }
        });
    </script>
</body>
</html>
