<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="UTF-8">
  <title>Shokuin Taiko</title>

  <!-- INICIO -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="/css/sidebars.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />

</head>
<!-- ELEMENTOS -->
<body onload="carregarHome()">
<main class="d-flex flex-nowrap">

  <!-- HOMEPAGE -->
  <div id="home">
  </div>
  <div class="b-example-divider b-example-vr"></div>


  <!-- LAYOUT CUSTOMIZAVEL -->
  <div class="d-flex vw-100">
    <section class="h-100 h-custom w-100">
      <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col-lg-8 col-xl-6">
            <div class="card rounded-3 shadow-sm">
              <img src="https://fjsp.org.br/wp-content/uploads/2020/10/taiko-c.jpg"
                   class="w-100" style="border-top-left-radius: .3rem; border-top-right-radius: .3rem; object-fit: cover; height: 180px;"
                   alt="Instrumento">

              <div class="card-body p-4 p-md-5">
                <h3 class="mb-4 pb-2 pb-md-0 mb-md-4">Editar Instrumento</h3>

                <form class="px-md-2" id="formInstrumento" enctype="multipart/form-data">

                  <div class="mb-4">
                    <label class="form-label select-label">Selecione o Instrumento que deseja editar</label>
                    <select onchange="carregarInstrumento(this.value)" class="form-select" id="opInstrumentos" data-mdb-select-init>
                    </select>
                  </div>
                <hr>
                  <div class="form-outline mb-4" data-mdb-input-init>
                    <label class="form-label" for="nomeInst">Nome do Instrumento</label>
                    <input id="nomeInstrumento" type="text" id="nomeInst" class="form-control" />
                  </div>

                  <!--
                   <div class="mb-4">
                       <label for="imgFile" class="form-label small text-muted">Imagem do Instrumento</label>
                       <input class="form-control" type="file" id="imgFile" accept="image/*">
                   </div>
                   -->

                  <div class="mb-4">
                    <label class="form-label select-label">Fornecedor</label>
                    <select  class="form-select" id="opFornecedores" data-mdb-select-init>
                    </select>
                  </div>
                </form>
                <button onclick="atualizarInstrumentos()" class="btn btn-success btn-lg mb-1 w-100" data-mdb-button-init>
                  Atualizar
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

</main>
<script src="/js/sidebars.js" class="astro-vvvwv3sm"></script>
<script src="js/script.js"></script>
<script src="js/editarInstrumento.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
