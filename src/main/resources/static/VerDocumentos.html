<!doctype html>
<html lang="pt-br" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Relatório de Documentos</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_EW1pVi14HZShWF8KD4Uu3NALLJ7uBalzJA&s" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/agendasStyle.css" rel="stylesheet" />
</head>

<body onload="carregarHome(); listarDocumentos()">

<div id="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content d-flex flex-column">

        <div class="container-fluid p-4 p-md-5 mx-auto" style="max-width: 1200px;">
            <div class="row g-4">
                <div class="col-12 col-lg-12">
                    <div class="glass-panel p-4 shadow-sm h-100 bg-white rounded-4 border border-light">

                        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                            <div>
                                <h3 class="font-display fw-bold fs-4 text-dark mb-0">Relatórios de Documentos</h3>
                                <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Roteiros e Textos Cadastrados</span>
                            </div>
                            <div class="input-group shadow-sm" style="max-width: 350px;">
                                <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0 bg-white" id="campoPesquisaDoc" placeholder="Pesquisar documento ou apresentação..." oninput="filtrarDocumentos()">
                            </div>
                        </div>

                        <div id="lista-documentos" class="d-flex flex-column gap-3">
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalPrevia" tabindex="-1" aria-labelledby="modalPreviaLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                    <div class="modal-header border-bottom pb-2">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-light text-dark p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-eye fs-5 text-taiko-red"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark" id="previaTitulo">Título do Documento</h5>
                                <span id="previaSubtitulo" class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Apresentação</span>
                            </div>
                        </div>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body p-4 text-center" style="max-height: 75vh; overflow-y: auto; background-color: #e9ecef;">
                        <div id="previaConteudo" class="text-start shadow-lg mx-auto ql-editor" style="
                            font-family: 'Noto Sans', sans-serif;
                            background-color: #ffffff;
                            width: 100%;
                            max-width: 21cm;
                            min-height: 29.7cm;
                            padding: 2.5cm 2cm;
                            border: 1px solid #dee2e6;
                            font-size: 14px;
                            line-height: 1.6;
                            color: #212529;">
                            Carregando conteúdo...
                        </div>
                    </div>

                    <div class="modal-footer border-top bg-white">
                        <button type="button" class="btn btn-light px-4 fw-semibold text-secondary shadow-sm" data-bs-dismiss="modal">Fechar</button>
                        <button id="btnBaixarDoModal" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2">
                            <i class="bi bi-download"></i> Baixar PDF
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="modalSucessoGenerico" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered modal-lg" style="margin: 0 auto; width: 30%">
                <div class="modal-content" style="border: none; border-top: 4px solid #198754; background-color: #fff;">
                    <div class="modal-header border-bottom-0 pb-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-success text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-check-circle-fill fs-5"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark">Sucesso</h5>
                                <span class="text-success small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Operação Concluída</span>
                            </div>
                        </div>
                    </div>
                    <div class="modal-body p-4 pt-3">
                        <p id="textoSucessoGenerico" class="fw-medium text-dark mb-4"></p>
                        <div class="modal-footer border-top-0 p-0 d-flex justify-content-end">
                            <button type="button" class="btn btn-success px-4 fw-bold shadow-sm" data-bs-dismiss="modal" onclick="window.location.reload()">OK</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="modalErroGenerico" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg" style="margin: 0 auto; width: 30%">
                <div class="modal-content" style="border: none; border-top: 4px solid #dc3545; background-color: #fff;">
                    <div class="modal-header border-bottom-0 pb-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-danger text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-x-circle-fill fs-5"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark">Erro</h5>
                                <span class="text-danger small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Falha na Operação</span>
                            </div>
                        </div>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 pt-3">
                        <p id="textoErroGenerico" class="fw-medium text-dark mb-4"></p>
                        <div class="modal-footer border-top-0 p-0 d-flex justify-content-end">
                            <button type="button" class="btn btn-danger px-4 fw-bold shadow-sm" data-bs-dismiss="modal">Fechar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/listarDocumentos/listarDocumentos.js"></script>
</body>
</html>
