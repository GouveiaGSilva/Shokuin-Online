<!doctype html>
<html lang="pt-br" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Tipos de Cargos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body onload="carregarHome(); carregarIconesCargos()">
    <!-- ICONES VALIDAÇÃO CARGOS -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;" id="icones">
    </svg>

    <div id="app-wrapper">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content d-flex flex-column">
            <div class="container-fluid p-4 p-md-5 mx-auto" style="max-width: 1000px;">
                <div class="text-center mb-5">
                    <h2 class="font-display fw-bold display-6 mb-2 text-dark">Tipos de Cargos</h2>
                    <p class="text-muted mx-auto" style="max-width: 500px;">Nomenclatura das hierarquias e responsabilidades de som.</p>
                </div>
                <div class="glass-panel p-4 p-md-5 shadow-lg position-relative overflow-hidden" style="border-top: 4px solid var(--taiko-gold); background-color: #ffffff;">
                    <div class="position-relative z-1">
                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
                            <div class="input-group input-group-lg shadow-sm" style="max-width: 400px;">
                                <span class="input-group-text bg-light border-end-0 text-secondary"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="pesquisar" placeholder="Pesquisar..." style="font-size: 1rem;">
                            </div>
                            <button class="btn btn-taiko shadow-sm px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#cadastrar"><i class="bi bi-plus-circle me-2"></i> Adicionar</button>
                        </div>
                        
                        <div class="table-responsive">
                            <table id="tabela" class="table table-hover align-middle">
                                <thead class="table-light"><tr><th style="min-width: 35%">Cargo</th><th style="min-width: 35%">Função</th><th style="min-width: 30%" class="text-center">Ações</th></tr></thead>
                                <tbody id="resultado">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        <!--Modal de alterar !-->
        <div class="modal fade" id="alterar" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                    <div class="modal-header border-bottom-0 pb-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-pencil-square fs-5"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark" id="editModalLabel">Atualizar Cargo</h5>
                                <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Atualizar informações</span>
                            </div>
                        </div>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 pt-3">
                        <form id="formAtualizacao">
                            <div class="mb-4">
                                <label for="cargo" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Nome <span class="text-danger">*</span></label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-taiko-red"><i class="bi bi-music-note-list"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="cargo" name="cargo" required>
                                </div>
                            </div>
                            <div class="row g-4 mb-4">
                                <div class="col-md-12">
                                    <label for="funcao" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Função <span class="text-danger">*</span></label>
                                    <div class="input-group shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-taiko-gold"><i class="bi bi-clock-history"></i></span>
                                        <textarea class="form-control border-start-0 ps-0 fw-medium bg-light" id="funcao" name="funcao" step="1" required></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                                <button type="button" class="btn btn-light px-4 fw-semibold text-secondary shadow-sm" data-bs-dismiss="modal">Cancelar</button>
                                <button id="btConfirmaAlterar" type="submit" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2">
                                    <i class="bi bi-save"></i> Salvar Alterações
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        </main>

        <!--Modal de excluir !-->
        <div class="modal fade" id="excluir" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg" style="margin: 0 auto; width: 30%">
                <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                    <div class="modal-header border-bottom-0 pb-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-pencil-square fs-5"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark" id="excluirLabel">Aviso</h5>
                                <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Excluir Cargo</span>
                            </div>
                        </div>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 pt-3" style="margin-bottom: -5%">
                            <p class="modal-title font-display fw-bold text-dark" >Deseja realmente excluir?</p>
                            <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                                <button type="button" class="btn btn-light px-4 fw-semibold text-secondary shadow-sm" data-bs-dismiss="modal">Cancelar</button>
                                <button id="btConfirma" type="submit" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2" data-bs-dismiss="modal">
                                    <i class="bi bi-save"></i> Confirmar
                                </button>
                            </div>
                    </div>
                </div>
            </div>
        </div>

        <!--Modal de cadastro !-->
        <div class="modal fade" id="cadastrar" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                    <div class="modal-header border-bottom-0 pb-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-pencil-square fs-5"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark" id="cadastrarLabel">Cadastrar Cargo</h5>
                                <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Inserir informações</span>
                            </div>
                        </div>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 pt-3">
                        <form id="formCadastro">
                            <div class="mb-4">
                                <label for="nomeCargo" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Nome do Cargo <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-taiko-gold"><i class="bi bi-bookmark-star"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" name="cargo" id="nomeCargo" placeholder="Ex: Tocador Base, Auxiliar, Coordenador" required style="font-size: 1.1rem;">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="funcaoC" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Função / Descrição <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-secondary align-items-start pt-3"><i class="bi bi-card-text"></i></span>
                                    <textarea class="form-control border-start-0 ps-0 fw-medium bg-light" name="funcao" id="funcaoC" rows="4" placeholder="Descreva as responsabilidades que esse cargo exige na apresentação." required></textarea>
                                </div>
                            </div>
                            <div class="d-flex flex-column flex-md-row justify-content-end gap-3 mt-5 pt-3">
                                <button type="reset" class="btn btn-light px-4 py-3 fw-semibold text-secondary shadow-sm d-flex align-items-center justify-content-center gap-2" style="border: 1px solid #e5e7eb;">
                                    <i class="bi bi-eraser fs-5"></i> Limpar
                                </button>
                                <button type="submit" class="btn btn-taiko px-5 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-check2-square fs-5"></i> Registrar Cargo
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>



    </div>
    <script src="js/sidebars.js"></script>
    <script src="js/script.js"></script>
    <script src="js/gerenciarCargo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
