<!doctype html>
<html lang="pt-BR" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Formações de Palco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body onload="carregarHome()">
<div id="app-wrapper">
    <div id="mobile-overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content d-flex flex-column position-relative">
        <nav class="d-md-none bg-white shadow-sm p-3 d-flex justify-content-between align-items-center sticky-top">
            <div class="d-flex align-items-center gap-2">
                <div class="rounded-circle bg-taiko-red d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;"><span class="text-white font-display fw-bold" style="font-size: 0.875rem;">F</span></div>
                <span class="font-display fw-bold fs-5 text-dark">SHOKUIN</span>
            </div>
            <button class="btn btn-link text-dark p-0 text-decoration-none" onclick="toggleSidebar()"><i class="bi bi-list fs-2"></i></button>
        </nav>

        <div class="container-fluid p-4 p-md-5 mx-auto position-relative" style="max-width: 1000px;">

            <div class="position-absolute d-none d-md-block" style="top: 30px; left: 30px; z-index: 10;">
                <button type="button" class="btn btn-link text-secondary text-decoration-none d-flex align-items-center gap-2 px-0 hover-opacity" onclick="voltar()">
                    <i class="bi bi-chevron-left fs-4"></i> <span class="fw-semibold">Voltar</span>
                </button>
            </div>
            <div class="d-md-none mb-4 text-start">
                <button type="button" class="btn btn-link text-secondary text-decoration-none d-inline-flex align-items-center gap-2 px-0" onclick="voltar()">
                    <i class="bi bi-chevron-left fs-5"></i> <span class="fw-semibold">Voltar</span>
                </button>
            </div>
            <div class="text-center mb-5 mt-md-0 mt-3">
                <h2 class="font-display fw-bold display-6 mb-2 text-dark">Formações da apresentação</h2>
                <p class="text-muted mx-auto" style="max-width: 500px;">Escolha a formação que você deseja editar</p>
            </div>

            <div class="glass-panel p-4 p-md-5 shadow-lg position-relative overflow-hidden" style="border-top: 4px solid var(--taiko-gold); background-color: #ffffff;">
                <div class="position-relative z-1">
                    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mt-2" id="cardsContainer">
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<style>
    .formation-card {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.5);
        transform-origin: center bottom;
    }
    .formation-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px rgba(0,0,0,0.08) !important;
        border-color: rgba(212, 175, 55, 0.3); /* taiko-gold com opacidade */
    }
    .formation-card .card-bg-icon {
        transition: all 0.6s ease;
    }
    .formation-card:hover .card-bg-icon {
        transform: scale(1.2) rotate(-15deg);
        opacity: 0.15 !important;
    }
    .stage-btn {
        background: linear-gradient(135deg, var(--taiko-ink), #2d3748);
        border: none;
        transition: all 0.3s ease;
    }
    .stage-btn:hover {
        background: linear-gradient(135deg, var(--taiko-red), #c53030);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(229, 62, 62, 0.3);
    }
</style>

<script src="js/script.js"></script>
<script src="js/listarFormacaoApresentacao.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
