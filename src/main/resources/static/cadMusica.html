<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Dantai Fênix</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_EW1pVi14HZShWF8KD4Uu3NALLJ7uBalzJA&s"
        type="image/x-icon">

    <!-- INICIO -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet" />

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>
<!-- ELEMENTOS -->

<body onload="carregarHome()">
    <div id="app-wrapper">

        <!-- SIDEBAR -->
        <div id="mobile-overlay" onclick="toggleSidebar()"></div>
        <aside class="sidebar" id="sidebar"></aside>


        <!-- LAYOUT CUSTOMIZAVEL -->
        <!-- DASHBOARD PRINCIPAL -->
        <main class="main-content d-flex flex-column">
            
            <!-- Navbar Mobile (Aparece apenas em telas pequenas) -->
            <nav class="d-md-none bg-white shadow-sm p-3 d-flex justify-content-between align-items-center sticky-top">
                <div class="d-flex align-items-center gap-2">
                    <div class="rounded-circle bg-taiko-red d-flex align-items-center justify-content-center"
                        style="width: 32px; height: 32px;">
                        <span class="text-white font-display fw-bold" style="font-size: 0.875rem;">F</span>
                    </div>
                    <span class="font-display fw-bold fs-5 text-dark">SHOKUIN</span>
                </div>
                <button class="btn btn-link text-dark p-0 text-decoration-none" onclick="toggleSidebar()">
                    <i class="bi bi-list fs-2"></i>
                </button>
            </nav>

            <div class="container-fluid p-4 p-md-5 mx-auto" style="max-width: 800px;">
                
                <!-- Titulo da Página -->
                <div class="text-center mb-5">
                    <h2 class="font-display fw-bold display-6 mb-2 text-dark">Acervo Musical</h2>
                    <p class="text-muted mx-auto" style="max-width: 500px;">Adicione uma nova música ao repertório do Dantai Fênix. O som dos tambores ecoa através das gerações.</p>
                </div>

                <!-- Form Card Estilizado (Tema Taiko) -->
                <div class="glass-panel p-4 p-md-5 shadow-lg position-relative overflow-hidden" style="border-top: 4px solid var(--taiko-red); background-color: #ffffff;">
                    <!-- Ícone Decorativo Secundário (fundo) -->
                    <i class="bi bi-music-note-beamed position-absolute" style="font-size: 18rem; right: -40px; bottom: -60px; opacity: 0.03; z-index: 0; color: var(--taiko-ink); transform: rotate(-15deg);"></i>
                    
                    <div class="position-relative z-1">
                        
                        <!-- Cabeçalho do Card -->
                        <div class="d-flex align-items-center gap-3 mb-5 pb-3 border-bottom border-light">
                            <div class="bg-taiko-red text-white p-3 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 55px; height: 55px;">
                                <i class="bi bi-journal-plus fs-4"></i>
                            </div>
                            <div>
                                <h4 class="font-display fw-bold m-0 text-dark">Cadastro de Música</h4>
                                <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.15em;">Novo Registro</span>
                            </div>
                        </div>

                        <!-- Formulário -->
                        <form>
                            <!-- Nome -->
                            <div class="mb-4">
                                <label for="nome" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Nome da Obra <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-taiko-red"><i class="bi bi-music-note-list"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="nome" placeholder="Ex: Hiryu, Matsuri, Gekidou" required style="font-size: 1.1rem;">
                                </div>
                            </div>

                            <div class="row g-4 mb-4">
                                <!-- Duração -->
                                <div class="col-md-6">
                                    <label for="duracao" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Duração Estimada <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-taiko-gold"><i class="bi bi-clock-history"></i></span>
                                        <input type="time" class="form-control border-start-0 ps-0 fw-medium bg-light" id="duracao" step="1" required>
                                    </div>
                                    <div class="form-text text-muted small mt-2"><i class="bi bi-info-circle"></i> Tempo base de execução.</div>
                                </div>

                                <!-- Compositor -->
                                <div class="col-md-6">
                                    <label for="compositor" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Compositor / Arranjador <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-person-lines-fill"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="compositor" placeholder="Nome do mestre criador" required>
                                    </div>
                                    <div class="form-text text-muted small mt-2"><i class="bi bi-info-circle"></i> Criador da música original.</div>
                                </div>
                            </div>
                            
                            <!-- Botões -->
                            <div class="d-flex flex-column flex-md-row justify-content-end gap-3 mt-5 pt-3">
                                <button type="reset" class="btn btn-light px-4 py-3 fw-semibold text-secondary shadow-sm d-flex align-items-center justify-content-center gap-2" style="border: 1px solid #e5e7eb;">
                                    <i class="bi bi-eraser fs-5"></i> Limpar
                                </button>
                                <button type="button" class="btn btn-taiko px-5 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2" onclick="cadastroMusicas()">
                                    <i class="bi bi-check2-circle fs-5"></i> Registrar Música
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/cadastroMusicas.js"></script>
</body>

</html>
