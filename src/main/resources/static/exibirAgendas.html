<!doctype html>
<html lang="pt-br" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Dantai Fênix</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_EW1pVi14HZShWF8KD4Uu3NALLJ7uBalzJA&s" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/agendasStyle.css" rel="stylesheet" />
</head>

<body onload="carregarHome()">
<div id="app-wrapper">

    <!--Modal de excluir !-->
    <div class="modal fade" id="excluir" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" style="margin: 0 auto; width: 30%">
            <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                <div class="modal-header border-bottom-0 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                            <i class="bi bi-pencil-square fs-5"></i>
                        </div>
                        <div>
                            <h5 class="modal-title font-display fw-bold text-dark" id="excluirLabel">Aviso</h5>
                            <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Excluir Agendamento</span>
                        </div>
                    </div>
                    <button type="button" class="btn-close shadow-none" data-bs-toggle="modal" data-bs-target="#modalDetalhesAgenda" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 pt-3" style="margin-bottom: -5%">
                    <p class="modal-title font-display fw-bold text-dark" >Deseja realmente excluir?</p>
                    <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                        <button type="button" class="btn btn-light px-4 fw-semibold text-secondary shadow-sm" data-bs-toggle="modal" data-bs-target="#modalDetalhesAgenda">Cancelar</button>
                        <button id="btConfirma" type="button" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2" data-bs-dismiss="modal" onclick="excluirAgenda()">
                            <i class="bi bi-save"></i> Confirmar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--Modal de cancelar !-->
    <div class="modal fade" id="cancelar" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" style="margin: 0 auto; width: 30%">
            <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                <div class="modal-header border-bottom-0 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                            <i class="bi bi-pencil-square fs-5"></i>
                        </div>
                        <div>
                            <h5 class="modal-title font-display fw-bold text-dark" id="cancelarLabel">Aviso</h5>
                            <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Cancelar Agendamento</span>
                        </div>
                    </div>
                    <button type="button" class="btn-close shadow-none" data-bs-toggle="modal" data-bs-target="#modalDetalhesAgenda" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 pt-3" style="margin-bottom: -5%">
                    <p class="modal-title font-display fw-bold text-dark" >Deseja realmente cancelar?</p>
                    <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                        <button type="button" class="btn btn-light px-4 fw-semibold text-secondary shadow-sm" data-bs-toggle="modal" data-bs-target="#modalDetalhesAgenda">Cancelar</button>
                        <button type="button" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2" data-bs-dismiss="modal" onclick="cancelarAgenda()">
                            <i class="bi bi-save"></i> Confirmar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--Modal de mensagens !-->
    <div class="modal fade" id="modalMsg" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" style="margin: 0 auto; width: 30%">
            <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                <div class="modal-header border-bottom-0 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                            <i class="bi bi-pencil-square fs-5"></i>
                        </div>
                        <div>
                            <h5 class="modal-title font-display fw-bold text-dark">Aviso</h5>
                            <span id="subtitulo" class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;"></span>
                        </div>
                    </div>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 pt-3" style="margin-bottom: -5%">
                    <p id="msg" class="modal-title font-display fw-bold text-dark" ></p>
                    <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                        <button type="button" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2" data-bs-dismiss="modal">
                            <i class="bi bi-save"></i> Fechar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!--Modal de salvar !-->
    <div class="modal fade" id="modalSave" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" style="margin: 0 auto; width: 30%">
            <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                <div class="modal-header border-bottom-0 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                            <i class="bi bi-pencil-square fs-5"></i>
                        </div>
                        <div>
                            <h5 class="modal-title font-display fw-bold text-dark">Aviso</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close shadow-none" data-bs-toggle="modal" data-bs-target="#modalDetalhesAgenda" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 pt-3" style="margin-bottom: -5%">
                    <p id="save" class="modal-title font-display fw-bold text-dark" ></p>
                    <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                        <button type="button" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#modalDetalhesAgenda">
                            <i class="bi bi-save"></i> Fechar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content d-flex flex-column">

        <div class="container-fluid p-4 p-md-5 mx-auto" style="max-width: 1200px;">

            <div class="row g-4">

                <div class="col-12 col-lg-7">
                    <div class="glass- panel p-4 shadow-sm h-100 bg-white rounded-4 border border-light">
                        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                            <h3 class="font-display fw-bold fs-4 text-dark mb-0">Agenda de Apresentações</h3>

                            <div class="d-flex align-items-center gap-3">
                                <button onclick="carregarProximas()" class="btn btn-link text-secondary text-decoration-none fw-semibold small p-0" onmouseover="this.classList.replace('text-secondary', 'text-dark')" onmouseout="this.classList.replace('text-dark', 'text-secondary')">
                                    <i class="bi bi-arrow-right-circle me-1"></i> Ver próximas
                                </button>
                                <span class="text-muted opacity-25">|</span>
                                <button onclick="limparFiltro()" class="btn btn-link text-taiko-red text-decoration-none fw-semibold small p-0">
                                    Ver todas
                                </button>
                            </div>
                        </div>

                        <div id="lista-agendas" class="d-flex flex-column gap-3">
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-5">
                    <div class="glass-panel p-4 shadow-sm bg-white rounded-4 border border-light sticky-top" style="top: 20px;">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4 class="font-display fw-bold fs-5 text-dark mb-0 d-flex align-items-center gap-2">
                                <i class="bi bi-calendar3 text-secondary"></i> Calendário
                            </h4>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3 px-2">
                            <button class="btn btn-sm btn-outline-secondary border-0" onclick="mudarMes(-1)">
                                <i class="bi bi-chevron-left"></i>
                            </button>
                            <h6 id="mes-ano-texto" class="fw-bold mb-0 text-uppercase" style="letter-spacing: 0.05em; color: var(--taiko-red);">Novembro 2024</h6>
                            <button class="btn btn-sm btn-outline-secondary border-0" onclick="mudarMes(1)">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                        </div>

                        <div id="calendario" class="calendar-grid">
                        </div>

                        <p class="text-muted small text-center mt-3 mb-0 d-flex align-items-center justify-content-center gap-2">
                            <span style="display:inline-block; width:10px; height:10px; background:var(--taiko-red); border-radius:50%; box-shadow: 0 0 6px rgba(230, 57, 70, 0.5);"></span>
                            Dias com eventos agendados
                        </p>
                    </div>
                </div>

            </div>

        </div>

        <div class="modal fade" id="modalDetalhesAgenda" tabindex="-1" aria-labelledby="modalDetalhesAgendaLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">

                <div class="modal-content shadow-lg position-relative overflow-hidden" style="border-top: 4px solid var(--taiko-red); background-color: #ffffff;">
                    <i class="bi bi-calendar-event position-absolute" style="font-size: 18rem; right: -40px; bottom: -60px; opacity: 0.03; z-index: 0; color: var(--taiko-ink); transform: rotate(-15deg);"></i>

                    <div class="modal-header border-bottom border-light position-relative z-1 px-4 pt-4 pb-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-calendar2-check fs-5"></i>
                            </div>
                            <div>
                                <h4 class="font-display fw-bold m-0 text-dark" id="modalDetalhesAgendaLabel">Detalhes do Evento</h4>
                                <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.15em;">Visualizar / Editar</span>
                            </div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body position-relative z-1 p-4 p-md-5 pt-4">
                        <form id="formEditarAgenda">
                            <h5 class="fw-bold mb-3 text-dark border-bottom pb-2"><i class="bi bi-clock-history me-2 text-taiko-red"></i>Data e Horário</h5>
                            <div class="row g-4 mb-4">
                                <div class="col-md-6">
                                    <label for="data-modal" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Data do Evento <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-taiko-red"><i class="bi bi-calendar-date"></i></span>
                                        <input type="date" class="form-control border-start-0 ps-0 fw-medium bg-light" id="data-modal" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="horario-modal" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Horário <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-taiko-gold"><i class="bi bi-clock"></i></span>
                                        <input type="time" class="form-control border-start-0 ps-0 fw-medium bg-light" id="horario-modal" required>
                                    </div>
                                </div>
                            </div>

                            <h5 class="fw-bold mb-3 text-dark border-bottom pb-2 mt-4"><i class="bi bi-geo-alt me-2 text-taiko-red"></i>Localização</h5>
                            <div class="row g-4 mb-3">
                                <div class="col-md-4">
                                    <label for="cep-modal" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">CEP <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-123"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="cep-modal" oninput="mascaraCEP(event)" placeholder="00000-000" maxlength="9" required>
                                    </div>
                                </div>

                                <div class="col-md-3">
                                    <label for="estado-modal" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Estado <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-map"></i></span>
                                        <select class="form-select border-start-0 ps-0 fw-medium bg-light" id="estado-modal" required style="font-size: 1rem;">
                                            <option value="" selected disabled>UF</option>
                                            <option value="AC">AC</option>
                                            <option value="AL">AL</option>
                                            <option value="AP">AP</option>
                                            <option value="AM">AM</option>
                                            <option value="BA">BA</option>
                                            <option value="CE">CE</option>
                                            <option value="DF">DF</option>
                                            <option value="ES">ES</option>
                                            <option value="GO">GO</option>
                                            <option value="MA">MA</option>
                                            <option value="MT">MT</option>
                                            <option value="MS">MS</option>
                                            <option value="MG">MG</option>
                                            <option value="PA">PA</option>
                                            <option value="PB">PB</option>
                                            <option value="PR">PR</option>
                                            <option value="PE">PE</option>
                                            <option value="PI">PI</option>
                                            <option value="RJ">RJ</option>
                                            <option value="RN">RN</option>
                                            <option value="RS">RS</option>
                                            <option value="RO">RO</option>
                                            <option value="RR">RR</option>
                                            <option value="SC">SC</option>
                                            <option value="SP">SP</option>
                                            <option value="SE">SE</option>
                                            <option value="TO">TO</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="col-md-5">
                                    <label for="cidade-modal" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Cidade <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-buildings"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="cidade-modal" placeholder="Nome da cidade" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-4 mb-3">
                                <div class="col-md-9">
                                    <label for="rua-modal" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Rua / Avenida <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-signpost-split"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="rua-modal" placeholder="Endereço principal" required>
                                    </div>
                                </div>

                                <div class="col-md-3">
                                    <label for="numero-modal" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Número <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-hash"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="numero-modal" placeholder="123" oninput="mascaraNumero(event)" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label for="bairro-modal" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Bairro <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-pin-map"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="bairro-modal" placeholder="Nome do bairro" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="complemento-modal" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Complemento</label>
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-door-open"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="complemento-modal" placeholder="Apto, Bloco, etc">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>


                    <div class="modal-footer border-top border-light position-relative z-1 p-4 bg-light d-flex justify-content-between flex-wrap gap-3">

                        <div class="d-flex gap-2">
                                <button type="button" class="btn btn-danger px-3 py-2 fw-bold shadow-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#excluir">
                                <i class="bi bi-trash fs-5"></i> Excluir
                            </button>

                            <button id="btCancelar" type="button" class="btn btn-warning px-3 py-2 fw-bold shadow-sm d-flex align-items-center gap-2 text-dark" data-bs-toggle="modal" data-bs-target="#cancelar">
                                <i class="bi bi-slash-circle fs-5"></i> Cancelar Apresentação
                            </button>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-light px-4 py-2 fw-semibold text-secondary shadow-sm" data-bs-dismiss="modal" style="border: 1px solid #e5e7eb;">
                                Fechar
                            </button>
                            <button id="btSalvar" type="button" class="btn btn-success px-4 py-2 fw-bold shadow-sm d-flex align-items-center gap-2" data-bs-dismiss="modal" onclick="atualizarAgenda()">
                                <i class="bi bi-check2-circle fs-5"></i> Salvar Alterações
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/ExibirAgendas.js"></script>
</body>

</html>
