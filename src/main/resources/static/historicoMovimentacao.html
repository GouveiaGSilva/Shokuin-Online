<!doctype html>
<html lang="pt-br" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Tipos de Cargos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body onload="carregarHome();">

    <div id="app-wrapper">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content d-flex flex-column">
            <div class="container-fluid p-4 p-md-5 mx-auto">
                <div class="text-center mb-5">
                    <h2 class="font-display fw-bold display-6 mb-2 text-dark">Histórico de movimentações</h2>
                    <p class="text-muted mx-auto" style="max-width: 500px;">Entradas e saídas no estoque.</p>
                </div>
                <div class="glass-panel p-4 p-md-5 shadow-lg position-relative overflow-hidden" style="border-top: 4px solid var(--taiko-gold); background-color: #ffffff;">
                    <div class="position-relative z-1">
                        <div class="d-flex flex-column flex-md-row align-items-center mb-4 gap-3">
<!--                            <div class="input-group input-group-lg shadow-sm" style="max-width: 400px;">-->
<!--                                <span class="input-group-text bg-light border-end-0 text-secondary"><i class="bi bi-search"></i></span>-->
<!--                                <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="pesquisar" placeholder="Pesquisar..." style="font-size: 1rem;">-->
<!--                            </div>-->
                            <div style="min-width: 15%">
                                <label for="dataIni" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Início</label>
                                <input type="date" class="form-control fw-medium bg-light" id="dataIni" required>
                            </div>
                            <div style="min-width: 15%">
                                <label for="dataFim" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Fim</label>
                                <input type="date" class="form-control fw-medium bg-light" id="dataFim" required>
                            </div>
                            <div style="min-width: 10%">
                                <label for="tipo" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Tipo</label>
                                <select id="tipo" class="form-select fw-medium bg-light">
                                    <option selected>Todos</option>
                                    <option>Entrada</option>
                                    <option>Saída</option>
                                </select>
                            </div>
                            <div style="display: flex; justify-content: end; min-width: 57%">
                            <a onclick="gerarPDF()" style="margin-left: 30%" class="btn btn-taiko shadow-sm px-4 fw-bold"><i class="bi me-2"></i>Gerar Relatório</a>
                            <a style="margin-left: 1%" class="btn btn-taiko shadow-sm px-4 fw-bold" href="./controlarEstoque.html"><i class="bi me-2"></i>Movimentar Estoque</a>
                            </div>
                        </div>
                        
                        <div class="table-responsive">
                            <table id="tabela" class="table table-hover align-middle">
                                <thead class="table-light">
                                <tr>
                                    <th style="min-width: 15%">Instrumento</th>
                                    <th style="min-width: 15%">Valor</th>
                                    <th style="min-width: 15%">Quantidade</th>
                                    <th style="min-width: 15%">Data</th>
                                    <th style="min-width: 15%">Tipo</th>
                                    <th style="min-width: 25%">Comentário</th>
                                </tr>
                                </thead>
                                <tbody id="resultado">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
    </main>
    </div>
    <script src="js/sidebars.js"></script>
    <script src="js/script.js"></script>
    <script src="js/historicoMov.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
</body>
</html>
