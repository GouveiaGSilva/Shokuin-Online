<!doctype html>
<html lang="pt-BR" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Participantes</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_EW1pVi14HZShWF8KD4Uu3NALLJ7uBalzJA&s" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <main class="main-content d-flex flex-column position-relative h-100">

        <div id="wizard-nav-container"></div>

        <div class="container-fluid p-4 p-md-5 mx-auto position-relative flex-grow-1" style="max-width: 1100px;">

            <div class="position-absolute d-none d-md-block" style="top: 30px; left: 30px; z-index: 10;">
                <button type="button" class="btn btn-link text-secondary text-decoration-none d-flex align-items-center gap-2 px-0 hover-opacity" onclick="voltar()">
                    <i class="bi bi-chevron-left fs-4"></i> <span class="fw-semibold">Voltar</span>
                </button>
            </div>
            <div class="d-md-none mb-4 text-start">
                <button type="button" class="btn btn-link text-secondary text-decoration-none d-inline-flex align-items-center gap-2 px-0" onclick="voltar()">
                    <i class="bi bi-chevron-left fs-5"></i> <span class="fw-semibold">Voltar</span>
                </button>
            </div>
            <div class="text-center mb-5 mt-md-0 mt-3">
                <h2 class="font-display fw-bold display-6 mb-2 text-dark">Participantes da Apresentação</h2>
                <p class="text-muted mx-auto" style="max-width: 500px;">Selecione os membros que participarão deste evento</p>
            </div>

            <div class="glass-panel p-4 p-md-5 shadow-lg position-relative overflow-hidden" style="border-top: 4px solid var(--taiko-red); background-color: #ffffff;">
                <i class="bi bi-people-fill position-absolute" style="font-size: 18rem; right: -40px; bottom: -60px; opacity: 0.03; z-index: 0; color: var(--taiko-ink); transform: rotate(-15deg);"></i>

                <div class="position-relative z-1">

                    <div class="d-flex align-items-center gap-3 mb-5 pb-3 border-bottom border-light">
                        <div class="bg-taiko-red text-white p-3 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 55px; height: 55px;">
                            <i class="bi bi-person-lines-fill fs-4"></i>
                        </div>
                        <div>
                            <h4 class="font-display fw-bold m-0 text-dark">Cadastro de Participantes</h4>
                            <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.15em;">Equipe do Evento</span>
                        </div>
                    </div>

                    <form id="formMembros">

                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center border-bottom pb-2 mb-4 gap-3">
                            <h5 class="fw-bold m-0 text-dark"><i class="bi bi-list-check me-2 text-taiko-red"></i>Membros Disponíveis</h5>
                            <div class="input-group input-group-sm" style="width: 100%; max-width: 300px;">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" id="buscaMembro" class="form-control border-start-0 bg-light ps-0" placeholder="Pesquisar membro..." onkeyup="filtrarMembros()">
                            </div>
                        </div>

                        <div id="lista-membros" class="row g-3 mb-4">
                            <!-- Os membros serão injetados aqui via JS em forma de cards com Switch -->
                        </div>

                        <div class="d-flex flex-column flex-md-row justify-content-end gap-3 mt-5 pt-3 border-top">
                            <button type="button" class="btn btn-taiko px-5 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2" onclick="salvarParticipantes()">
                                <i class="bi bi-check2-circle fs-5"></i> Concluir Apresentação
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Modal Sucesso/Erro -->
        <div class="modal fade" id="modalMsg" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                    <div class="modal-header border-bottom-0 pb-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-info-circle fs-5"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark">Aviso</h5>
                                <span id="subtitulo" class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;"></span>
                            </div>
                        </div>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 pt-3">
                        <p id="msg" class="mb-0 text-secondary"></p>
                    </div>
                    <div class="modal-footer border-top-0 pt-0 pe-4 pb-4 d-flex gap-2 w-100 justify-content-end" id="modal-footer-botoes">
                        <button type="button" class="btn btn-taiko px-4 fw-bold shadow-sm flex-grow-1" data-bs-dismiss="modal">
                            <i class="bi bi-check2"></i> Fechar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script src="js/script.js"></script>
<script src="js/DefinirMembrosApresentacao.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if(typeof injetarMenuEtapas === 'function') {
            injetarMenuEtapas("membros");
        }
    });
</script>
</body>
</html>
