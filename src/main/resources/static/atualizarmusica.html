<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <title>Shokuin Taiko</title>

    <!-- INICIO -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/sidebars.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />

</head>
<!-- ELEMENTOS -->
<body onload="carregarHome()">
<main class="d-flex flex-nowrap">

    <!-- HOMEPAGE -->
    <div id="home">
    </div>
    <div class="b-example-divider b-example-vr"></div>


    <!-- LAYOUT CUSTOMIZAVEL -->
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Atualizar Música</h4>
            </div>

            <div class="card-body">
                <form>

                    <!-- Nome -->
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome da Música</label>
                        <input type="text" class="form-control" id="nome" placeholder="Digite o nome" required>
                    </div>

                    <!-- Duração -->
                    <div class="mb-3">
                        <label for="duracao" class="form-label">Duração</label>
                        <input type="time" class="form-control" id="duracao" step="1" required>
                    </div>

                    <!-- Compositor -->
                    <div class="mb-3">
                        <label for="compositor" class="form-label">Compositor</label>
                        <input type="text" class="form-control" id="compositor" placeholder="Nome do compositor" required>
                    </div>

                    <!-- Botões -->
                    <div class="d-flex justify-content-end">
                        <button type="reset" class="btn btn-secondary me-2">Limpar</button>
                        <button class="btn btn-success" onclick="atualizarMusica()">Atualizar</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</main>
<script src="js/atualizarMusica.js"
<script src="/js/sidebars.js" class="astro-vvvwv3sm"></script>
<script src="js/script.js"></script>
<script src="js/atualizarMusica.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
