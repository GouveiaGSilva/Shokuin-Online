<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
  <meta charset="UTF-8">
  <title>ShokuinTaiko - Dantai Fênix - Cadastro de Fornecedor</title>
  <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_EW1pVi14HZShWF8KD4Uu3NALLJ7uBalzJA&s"
        type="image/x-icon">

  <!-- INICIO -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet" />

  <link
          href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>

<body onload="carregarHome()">
<div id="app-wrapper">

  <!-- SIDEBAR -->
  <div id="mobile-overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <!-- DASHBOARD PRINCIPAL -->
  <main class="main-content d-flex flex-column">

    <!-- Navbar Mobile -->
    <nav class="d-md-none bg-white shadow-sm p-3 d-flex justify-content-between align-items-center sticky-top">
      <div class="d-flex align-items-center gap-2">
        <div class="rounded-circle bg-taiko-red d-flex align-items-center justify-content-center"
             style="width: 32px; height: 32px;">
          <span class="text-white font-display fw-bold" style="font-size: 0.875rem;">F</span>
        </div>
        <span class="font-display fw-bold fs-5 text-dark">SHOKUIN</span>
      </div>
      <button class="btn btn-link text-dark p-0 text-decoration-none" onclick="toggleSidebar()">
        <i class="bi bi-list fs-2"></i>
      </button>
    </nav>

    <div class="container-fluid p-4 p-md-5 mx-auto" style="max-width: 800px;">

      <!-- Titulo da Página -->
      <div class="text-center mb-5">
        <h2 class="font-display fw-bold display-6 mb-2 text-dark">Parceiros e Fornecedores</h2>
        <p class="text-muted mx-auto" style="max-width: 500px;">Cadastre os fabricantes de taiko, bachi e outros equipamentos essenciais para o Dantai Fênix.</p>
      </div>

      <!-- Form Card Estilizado (Tema Taiko) -->
      <div class="glass-panel p-4 p-md-5 shadow-lg position-relative overflow-hidden" style="border-top: 4px solid var(--taiko-ink); background-color: #ffffff;">
        <!-- Ícone Decorativo Secundário (fundo) -->
        <i class="bi bi-truck position-absolute" style="font-size: 18rem; right: -40px; bottom: -60px; opacity: 0.03; z-index: 0; color: var(--taiko-ink); transform: rotate(-5deg);"></i>

        <div class="position-relative z-1">

          <!-- Cabeçalho do Card -->
          <div class="d-flex align-items-center gap-3 mb-5 pb-3 border-bottom border-light">
            <div class="bg-taiko-ink text-white p-3 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 55px; height: 55px; background-color: var(--taiko-ink);">
              <i class="bi bi-box-seam fs-4"></i>
            </div>
            <div>
              <h4 class="font-display fw-bold m-0 text-dark">Cadastro de Fornecedor</h4>
              <span class="text-secondary small fw-bold text-uppercase" style="letter-spacing: 0.15em;">Registro Nacional</span>
            </div>
          </div>

          <!-- Formulário -->
          <form>
            <!-- Nome Fornecedor -->
            <div class="mb-4">
              <label for="nomeFornecedor" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Razão Social / Nome <span class="text-danger">*</span></label>
              <div class="input-group input-group-lg shadow-sm">
                <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-shop"></i></span>
                <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="nomeFornecedor" placeholder="Nome da empresa fabricante" required style="font-size: 1.1rem;">
              </div>
            </div>

            <div class="row g-4 mb-4">
              <!-- CNPJ -->
              <div class="col-md-5">
                <label for="cnpj" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">CNPJ <span class="text-danger">*</span></label>
                <div class="input-group input-group-lg shadow-sm">
                  <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-upc-scan"></i></span>
                  <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="cnpj"
                         placeholder="00.000.000/0001-00" maxlength="18" oninput="mascaraCNPJ(this)" required style="font-size: 1.1rem;">
                </div>
              </div>

              <!-- Endereco -->
<!--              <div class="col-md-7">-->
<!--                <label for="endereco" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Endereço Completo</label>-->
<!--                <div class="input-group input-group-lg shadow-sm">-->
<!--                  <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-geo-alt-fill"></i></span>-->
<!--                  <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="endereco" placeholder="Rua, Número, Bairro, Cidade">-->
<!--                </div>-->
<!--              </div>-->
              <div class="row g-4 mb-4">
                <div class="col-md-4">
                  <label for="cep" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">CEP <span class="text-danger">*</span></label>
                  <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-123"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="cep" placeholder="00000-000" maxlength="9" required oninput="mascaraCEP(this)" onblur="buscarEndereco()">
                  </div>
                </div>

                <div class="col-md-3">
                  <label for="estado" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Estado <span class="text-danger">*</span></label>
                  <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-map"></i></span>
                    <select class="form-select border-start-0 ps-0 fw-medium bg-light" id="estado" required style="font-size: 1rem;">
                      <option value="" selected disabled>UF</option>
                      <option value="AC">AC</option>
                      <option value="AL">AL</option>
                      <option value="AP">AP</option>
                      <option value="AM">AM</option>
                      <option value="BA">BA</option>
                      <option value="CE">CE</option>
                      <option value="DF">DF</option>
                      <option value="ES">ES</option>
                      <option value="GO">GO</option>
                      <option value="MA">MA</option>
                      <option value="MT">MT</option>
                      <option value="MS">MS</option>
                      <option value="MG">MG</option>
                      <option value="PA">PA</option>
                      <option value="PB">PB</option>
                      <option value="PR">PR</option>
                      <option value="PE">PE</option>
                      <option value="PI">PI</option>
                      <option value="RJ">RJ</option>
                      <option value="RN">RN</option>
                      <option value="RS">RS</option>
                      <option value="RO">RO</option>
                      <option value="RR">RR</option>
                      <option value="SC">SC</option>
                      <option value="SP">SP</option>
                      <option value="SE">SE</option>
                      <option value="TO">TO</option>
                    </select>
                  </div>
                </div>

                <div class="col-md-5">
                  <label for="cidade" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Cidade <span class="text-danger">*</span></label>
                  <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-buildings"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="cidade" placeholder="Nome da cidade" required>
                  </div>
                </div>
              </div>

              <div class="row g-4 mb-4">
                <div class="col-md-9">
                  <label for="rua" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Rua / Avenida <span class="text-danger">*</span></label>
                  <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-signpost-split"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="rua" placeholder="Endereço principal" required>
                  </div>
                </div>

                <div class="col-md-3">
                  <label for="numero" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Número <span class="text-danger">*</span></label>
                  <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-hash"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="numero" placeholder="123" required oninput="mascaraNumero(this)">
                  </div>
                </div>
              </div>

              <div class="row g-4 mb-4">
                <div class="col-md-6">
                  <label for="bairro" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Bairro <span class="text-danger">*</span></label>
                  <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-pin-map"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="bairro" placeholder="Nome do bairro" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="complemento" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Complemento</label>
                  <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-door-open"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="complemento" placeholder="Apto, Bloco, etc (Opcional)">
                  </div>
                </div>
              </div>
            </div>

            <!-- Botões -->
            <div class="d-flex flex-column flex-md-row justify-content-end gap-3 mt-5 pt-3">
              <button type="reset" class="btn btn-light px-4 py-3 fw-semibold text-secondary shadow-sm d-flex align-items-center justify-content-center gap-2" style="border: 1px solid #e5e7eb;">
                <i class="bi bi-eraser fs-5"></i> Limpar
              </button>
              <button type="submit" class="btn btn-taiko px-5 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2" onclick="cadastrarFornecedor()">
                <i class="bi bi-check2-square fs-5"></i> Registrar Fornecedor
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="js/sidebars.js"></script>
<script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="js/fornecedor/viewFornecedores.js"></script>
</body>
</html>
