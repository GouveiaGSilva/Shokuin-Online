<!doctype html>
<html lang="pt-BR" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Dantai Fênix | Agendamento</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_EW1pVi14HZShWF8KD4Uu3NALLJ7uBalzJA&s" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <main class="main-content d-flex flex-column position-relative h-100">

        <div id="wizard-nav-container"></div>

        <div class="container-fluid p-4 p-md-5 mx-auto flex-grow-1" style="max-width: 900px;">

            <div class="text-center mb-5">
                <h2 class="font-display fw-bold display-6 mb-2 text-dark">Agende a apresentação</h2>
                <p class="text-muted mx-auto" style="max-width: 500px;">Defina a data, horário e o local completo do evento</p>
            </div>

            <div class="glass-panel p-4 p-md-5 shadow-lg position-relative overflow-hidden" style="border-top: 4px solid var(--taiko-red); background-color: #ffffff;">
                <i class="bi bi-calendar-event position-absolute" style="font-size: 18rem; right: -40px; bottom: -60px; opacity: 0.03; z-index: 0; color: var(--taiko-ink); transform: rotate(-15deg);"></i>

                <div class="position-relative z-1">

                    <div class="d-flex align-items-center gap-3 mb-5 pb-3 border-bottom border-light">
                        <div class="bg-taiko-red text-white p-3 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 55px; height: 55px;">
                            <i class="bi bi-calendar-plus fs-4"></i>
                        </div>
                        <div>
                            <h4 class="font-display fw-bold m-0 text-dark">Cadastro da agenda</h4>
                            <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.15em;">Novo Evento</span>
                        </div>
                    </div>

                    <form id="formAgenda">

                        <h5 class="fw-bold mb-3 text-dark border-bottom pb-2"><i class="bi bi-clock-history me-2 text-taiko-red"></i>Data e Horário</h5>
                        <div class="row g-4 mb-5">
                            <div class="col-md-6">
                                <label for="data" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Data do Evento <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-taiko-red"><i class="bi bi-calendar-date"></i></span>
                                    <input type="date" class="form-control border-start-0 ps-0 fw-medium bg-light" id="data" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="horario" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Horário <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-taiko-gold"><i class="bi bi-clock"></i></span>
                                    <input type="time" class="form-control border-start-0 ps-0 fw-medium bg-light" id="horario" required>
                                </div>
                            </div>
                        </div>

                        <h5 class="fw-bold mb-3 text-dark border-bottom pb-2"><i class="bi bi-geo-alt me-2 text-taiko-red"></i>Localização</h5>

                        <div class="row g-4 mb-4">
                            <div class="col-md-4">
                                <label for="cep" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">CEP <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-123"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="cep" placeholder="00000-000" maxlength="9" required oninput="mascaraCEP(this)" onblur="buscarEndereco()">
                                </div>
                            </div>

                            <div class="col-md-3">
                                <label for="estado" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Estado <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-map"></i></span>
                                    <select class="form-select border-start-0 ps-0 fw-medium bg-light" id="estado" required style="font-size: 1rem;">
                                        <option value="" selected disabled>UF</option>
                                        <option value="AC">AC</option>
                                        <option value="AL">AL</option>
                                        <option value="AP">AP</option>
                                        <option value="AM">AM</option>
                                        <option value="BA">BA</option>
                                        <option value="CE">CE</option>
                                        <option value="DF">DF</option>
                                        <option value="ES">ES</option>
                                        <option value="GO">GO</option>
                                        <option value="MA">MA</option>
                                        <option value="MT">MT</option>
                                        <option value="MS">MS</option>
                                        <option value="MG">MG</option>
                                        <option value="PA">PA</option>
                                        <option value="PB">PB</option>
                                        <option value="PR">PR</option>
                                        <option value="PE">PE</option>
                                        <option value="PI">PI</option>
                                        <option value="RJ">RJ</option>
                                        <option value="RN">RN</option>
                                        <option value="RS">RS</option>
                                        <option value="RO">RO</option>
                                        <option value="RR">RR</option>
                                        <option value="SC">SC</option>
                                        <option value="SP">SP</option>
                                        <option value="SE">SE</option>
                                        <option value="TO">TO</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-md-5">
                                <label for="cidade" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Cidade <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-buildings"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="cidade" placeholder="Nome da cidade" required>
                                </div>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-9">
                                <label for="rua" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Rua / Avenida <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-signpost-split"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="rua" placeholder="Endereço principal" required>
                                </div>
                            </div>

                            <div class="col-md-3">
                                <label for="numero" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Número <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-hash"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="numero" placeholder="123" required oninput="mascaraNumero(this)">
                                </div>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label for="bairro" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Bairro <span class="text-danger">*</span></label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-pin-map"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="bairro" placeholder="Nome do bairro" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="complemento" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Complemento</label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-door-open"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="complemento" placeholder="Apto, Bloco, etc (Opcional)">
                                </div>
                            </div>
                        </div>

                        <div class="d-flex flex-column flex-md-row justify-content-end gap-3 mt-5 pt-3 border-top">
                            <button type="reset" class="btn btn-light px-4 py-3 fw-semibold text-secondary shadow-sm d-flex align-items-center justify-content-center gap-2" style="border: 1px solid #e5e7eb;">
                                <i class="bi bi-eraser fs-5"></i> Limpar
                            </button>
                            <button type="button" class="btn btn-taiko px-5 py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2" onclick="cadastrarAgenda()">
                                <i class="bi bi-check2-circle fs-5"></i> Registrar Agenda
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!--Modal de mensagens !-->
        <div class="modal fade" id="modalMsg" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg" style="margin: 0 auto; width: 30%">
                <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                    <div class="modal-header border-bottom-0 pb-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-pencil-square fs-5"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark">Aviso</h5>
                                <span id="subtitulo" class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;"></span>
                            </div>
                        </div>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 pt-3" style="margin-bottom: -5%">
                        <p id="msg" class="modal-title font-display fw-bold text-dark" ></p>
                        <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                            <button type="button" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2" data-bs-dismiss="modal" onclick="finalizarCadastro()">
                                <i class="bi bi-save"></i> Fechar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/cadAgenda.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if(typeof injetarMenuEtapas === 'function') {
            injetarMenuEtapas("agenda");
        }
    });
</script>
</body>
</html>
