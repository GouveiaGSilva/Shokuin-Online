<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Acervo Musical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet" />
    <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body onload="carregarHome()">
<div id="app-wrapper">
    <div id="mobile-overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content d-flex flex-column">
        <nav class="d-md-none bg-white shadow-sm p-3 d-flex justify-content-between align-items-center sticky-top">
            <div class="d-flex align-items-center gap-2">
                <div class="rounded-circle bg-taiko-red d-flex align-items-center justify-content-center"
                     style="width: 32px; height: 32px;"><span class="text-white font-display fw-bold"
                                                              style="font-size: 0.875rem;">F</span></div>
                <span class="font-display fw-bold fs-5 text-dark">SHOKUIN</span>
            </div>
            <button class="btn btn-link text-dark p-0 text-decoration-none" onclick="toggleSidebar()"><i
                    class="bi bi-list fs-2"></i></button>
        </nav>

        <div class="container-fluid p-4 p-md-5 mx-auto" style="max-width: 1000px;">
            <div class="text-center mb-5">
                <h2 class="font-display fw-bold display-6 mb-2 text-dark">Acervo Musical</h2>
                <p class="text-muted mx-auto" style="max-width: 500px;">Catálogo geral das músicas base do Dantai.
                </p>
            </div>

            <div class="glass-panel p-4 p-md-5 shadow-lg position-relative overflow-hidden"
                 style="border-top: 4px solid var(--taiko-gold); background-color: #ffffff;">
                <div class="position-relative z-1">
                    <div
                            class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
                        <div class="input-group input-group-lg shadow-sm" style="max-width: 400px;">
                                <span class="input-group-text bg-light border-end-0 text-secondary"><i
                                        class="bi bi-search"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light"
                                   id="busca" placeholder="Pesquisar..." onkeyup="filtrarMusicas()" style="font-size: 1rem;">
                        </div>
                        <button class="btn btn-taiko shadow-sm px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#addModal">
                            <i class="bi bi-plus-circle me-2"></i> Adicionar
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Duração</th>
                                <th>Compositor</th>
                                <th class="text-center">Ações</th>
                            </tr>
                            </thead>
                            <tbody id="tabelaMusicas">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                <div class="modal-header border-bottom-0 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                            <i class="bi bi-pencil-square fs-5"></i>
                        </div>
                        <div>
                            <h5 class="modal-title font-display fw-bold text-dark" id="editModalLabel">Editar Música</h5>
                            <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Atualizar informações</span>
                        </div>
                    </div>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 pt-3">
                    <form id="editMusicaForm">
                        <!-- Nome -->
                        <div class="mb-4">
                            <label for="editNome" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Nome da Obra <span class="text-danger">*</span></label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text bg-light border-end-0 text-taiko-red"><i class="bi bi-music-note-list"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="editNome" placeholder="Ex: Hiryu, Matsuri, Gekidou" required>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <!-- Duração -->
                            <div class="col-md-6">
                                <label for="editDuracao" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Duração Estimada <span class="text-danger">*</span></label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-taiko-gold"><i class="bi bi-clock-history"></i></span>
                                    <input type="time" class="form-control border-start-0 ps-0 fw-medium bg-light" id="editDuracao" step="1" required>
                                </div>
                            </div>

                            <!-- Compositor -->
                            <div class="col-md-6">
                                <label for="editCompositor" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Compositor / Arranjador <span class="text-danger">*</span></label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-person-lines-fill"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="editCompositor" placeholder="Nome do mestre criador" required>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                    <button type="button" class="btn btn-light px-4 fw-semibold text-secondary shadow-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2" onclick="atualizarMusica()">
                        <i class="bi bi-save"></i> Salvar Alterações
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                <div class="modal-header border-bottom-0 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                            <i class="bi bi-music-note fs-5"></i>
                        </div>
                        <div>
                            <h5 class="modal-title font-display fw-bold text-dark" id="addModalLabel">Adicionar Música</h5>
                            <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Cadastrar nova obra</span>
                        </div>
                    </div>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 pt-3">
                    <form id="addMusicaForm">
                        <div class="mb-4">
                            <label for="addNome" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Nome da Obra <span class="text-danger">*</span></label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text bg-light border-end-0 text-taiko-red"><i class="bi bi-music-note-list"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="addNome" placeholder="Ex: Hiryu, Matsuri, Gekidou" required>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label for="addDuracao" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Duração Estimada <span class="text-danger">*</span></label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-taiko-gold"><i class="bi bi-clock-history"></i></span>
                                    <input type="time" class="form-control border-start-0 ps-0 fw-medium bg-light" id="addDuracao" step="1" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="addCompositor" class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Compositor / Arranjador <span class="text-danger">*</span></label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-light border-end-0 text-dark"><i class="bi bi-person-lines-fill"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 fw-medium bg-light" id="addCompositor" placeholder="Nome do mestre criador" required>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                    <button type="button" class="btn btn-light px-4 fw-semibold text-secondary shadow-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2" onclick="adicionarMusica()">
                        <i class="bi bi-plus-lg"></i> Cadastrar Música
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/script.js"></script>
<script src="js/listaMusicas.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
