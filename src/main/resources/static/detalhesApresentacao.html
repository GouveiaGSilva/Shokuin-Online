<!doctype html>
<html lang="pt-br" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <title>ShokuinTaiko - Gerar PDF</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_EW1pVi14HZShWF8KD4Uu3NALLJ7uBalzJA&s" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/agendasStyle.css" rel="stylesheet" />
</head>

<body onload="carregarHome(); listarApresentacoesPDF()">

<div id="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content d-flex flex-column">
        <div class="container-fluid p-4 p-md-5 mx-auto" style="max-width: 1200px;">
            <div class="row g-4">
                <div class="col-12">
                    <div class="glass- panel p-4 shadow-sm h-100 bg-white rounded-4 border border-light">

                        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                            <div>
                                <h3 class="font-display fw-bold fs-4 text-dark mb-1">Gerar Relatórios</h3>
                                <p class="text-muted small mb-0">Selecione uma apresentação agendada para visualizar a prévia ou baixar em PDF.</p>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-12 col-md-6 col-lg-4">
                                <div class="input-group shadow-sm rounded-pill overflow-hidden border">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="bi bi-search"></i>
                                    </span>
                                    <input type="text" id="inputPesquisa" class="form-control border-start-0 ps-0 bg-light shadow-none" placeholder="Buscar por apresentação..." oninput="filtrarApresentacoes()">
                                </div>
                            </div>
                        </div>

                        <div id="lista-pdf-agendas" class="d-flex flex-column gap-3">
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalPreviaPDF" tabindex="-1" aria-labelledby="modalPreviaLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content" style="border: none; border-top: 4px solid var(--taiko-gold);">
                    <div class="modal-header border-bottom-0 pb-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-taiko-red text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-file-earmark-pdf fs-5"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark" id="modalPreviaLabel">Prévia do Relatório</h5>
                                <span class="text-taiko-gold small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Estrutura do Documento</span>
                            </div>
                        </div>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 pt-3">
                        <div id="conteudoPrevia" class="bg-light p-4 rounded shadow-sm border" style="min-height: 250px;">
                            <p class="text-muted text-center my-5">A estrutura do PDF será desenhada nesta região.</p>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                        <button type="button" class="btn btn-light px-4 fw-semibold text-secondary shadow-sm" data-bs-dismiss="modal">Fechar</button>
                        <button id="btnBaixarDoModal" class="btn btn-taiko px-4 fw-bold shadow-sm d-flex align-items-center gap-2">
                            <i class="bi bi-download"></i> Baixar PDF
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="modalSucessoGenerico" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered modal-lg" style="margin: 0 auto; width: 30%">
                <div class="modal-content" style="border: none; border-top: 4px solid #198754; background-color: #fff;">
                    <div class="modal-header border-bottom-0 pb-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-success text-white p-2 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                                <i class="bi bi-check-circle-fill fs-5"></i>
                            </div>
                            <div>
                                <h5 class="modal-title font-display fw-bold text-dark">Sucesso</h5>
                                <span class="text-success small fw-bold text-uppercase" style="letter-spacing: 0.1em;">Operação Concluída</span>
                            </div>
                        </div>
                    </div>
                    <div class="modal-body p-4 pt-3">
                        <p id="textoSucessoGenerico" class="fw-medium text-dark mb-4"></p>
                        <div class="modal-footer border-top-0 p-0 d-flex justify-content-end">
                            <button type="button" class="btn btn-success px-4 fw-bold shadow-sm" data-bs-dismiss="modal" onclick="window.location.reload()">OK</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/detalhesApresentacao/detalhesApresentacao.js"></script>
</body>
</html>
